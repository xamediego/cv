<div class="form">
  <div class="form__content">
    @if(!project){
      <p>No project detected</p>
    } @else if (!processing) {
      @if (!updated) {
        <form [formGroup]="form" (ngSubmit)="submit()" class="form__form">

          <h2 class="form__title">Edit Project</h2>

          <div class="form__input-group">
            <label
              class="form__label"
              [class.error]="form.get('title')?.invalid && form.get('title')?.touched">
              Current Password
            </label>

            <input
              formControlName="title"
              [class.error]="form.get('title')?.invalid && form.get('title')?.touched"
              type="password"
            />
          </div>

          <div class="form__input-group">
            <label
              class="form__label"
              [class.error]="form.get('description')?.invalid && form.get('description')?.touched">
              New Password
            </label>

            <textarea
              formControlName="description"
              [class.error]="form.get('description')?.invalid && form.get('description')?.touched"
              type="password"
            ></textarea>
          </div>
          <p class="form__error">{{ errorMessage }}</p>

          <app-password-validator
            style="width: 100%"
            [password]="form.value.newPassword">
          </app-password-validator>

          <div class="form__button-group">
            <button class="form__button form__button__cancel" type="button" (click)="onFormClosed()">Cancel</button>
            <button class="form__button form__button__submit" type="submit">Confirm</button>
          </div>
        </form>
      } @else {
        <h2 class="form__title">Project Updated</h2>
        <p class="form__description" style="text-align: center">Project successfully updated!</p>
        <div class="form__button-group" style="justify-content: center">
          <button class="form__button form__button__cancel" type="button" (click)="onFormClosed()">Return</button>
        </div>
      }
    }
    <ng-container *appEventSpinner="{condition : processing,eventMessage : processMessage, stretchToParent : false}"/>
  </div>
</div>
