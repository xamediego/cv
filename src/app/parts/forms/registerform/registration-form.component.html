<div class="form">
  <div class="form__content">
    @if (!processing) {
      @if (!updated) {
        <form [formGroup]="form" (ngSubmit)="submit()" class="form__form">

          <div class="form__input-group">
            <label class="form__label"
                   [class.error]="form.get('username')?.invalid && form.get('username')?.touched">
              Username
            </label>
            <input
              type="text"
              formControlName="username"
              [class.error]="form.get('username')?.invalid && form.get('username')?.touched"/>
          </div>

          <div class="form__input-group">
            <label class="form__label"
                   [class.error]="form.get('displayName')?.invalid && form.get('displayName')?.touched">
              DisplayName
            </label>
            <input
              type="text"
              formControlName="displayName"
              [class.error]="form.get('displayName')?.invalid && form.get('displayName')?.touched"/>
          </div>

          <div class="form__input-group">
            <label class="form__label"
                   [class.error]="form.get('email')?.invalid && form.get('email')?.touched">
              Email
            </label>
            <input
              type="email"
              formControlName="email"
              [class.error]="form.get('email')?.invalid && form.get('email')?.touched"/>
          </div>

          <div class="form__input-group">
            <label class="form__label"
                   [class.error]="form.get('password')?.invalid && form.get('password')?.touched">
              Password
            </label>
            <input
              type="password"
              formControlName="password"
              [class.error]="form.get('password')?.invalid && form.get('password')?.touched"/>
          </div>

          <div class="form__input-group">
            <label class="form__label"
                   [class.error]="form.get('confirmPassword')?.invalid && form.get('confirmPassword')?.touched">
              Confirm Password
            </label>
            <input
              type="password"
              formControlName="confirmPassword"
              [class.error]="form.get('confirmPassword')?.invalid && form.get('confirmPassword')?.touched"/>
          </div>

          <app-password-validator
            style="width: 100%"
            [password]="form.value.password">
          </app-password-validator>

          @if (errorMessage){<p class="form__error">{{ errorMessage }}</p>}

          <div class="form__button-group">
            <button class="form__button form__button__cancel" type="button" (click)="onFormClosed()">Cancel</button>
            <button class="form__button form__button__submit" type="submit">Confirm</button>
          </div>
        </form>
      } @else {
        <div class="register__success">
          <h2 class="form__title">Registration Complete!</h2>
          <p class="form__description" style="text-align: center">
            Your account has been registered.<br>A verification mail has been sent to your account that you can use to
            activate your account.<br>After this you can login to the platform
          </p>
          <div class="form__button-group" style="justify-content: center">
            <button class="form__button form__button__cancel" type="button" (click)="onFormClosed()">Return</button>
          </div>
        </div>
      }
    }
    <ng-container *appEventSpinner="{condition : processing , eventMessage : processMessage, stretchToParent : true}"/>
  </div>
</div>
