<div class="form">
  @if (!processing) {
    @if (!updated) {
      <form [formGroup]="form" (ngSubmit)="submit()" class="form__form">

        <h2 class="form__title">Change Username</h2>
        <p class="form__description">This action will immediately update your username to the changes you've made.</p>

        <div class="form__input-group">
          <label
            class="form__label"
            [class.error]="form.get('username')?.invalid && form.get('username')?.touched">
            New Username
          </label>

          <input
            formControlName="username"
            [class.error]="form.get('username')?.invalid && form.get('username')?.touched"
            type="text"
          />
        </div>

        <div class="form__input-group">
          <label
            class="form__label"
            [class.error]="form.get('password')?.invalid && form.get('password')?.touched">
            Password
          </label>

          <input
            formControlName="password"
            [class.error]="form.get('password')?.invalid && form.get('password')?.touched"
            type="password"
          />
        </div>

        <p class="form__error">{{ errorMessage }}</p>

        <div class="form__button-group">
          <button class="form__button form__button__cancel" type="button" (click)="onFormClosed()">Cancel</button>
          <button class="form__button form__button__submit" type="submit">Confirm</button>
        </div>
      </form>
    } @else {
      <h2 class="form__title">Username Updated</h2>
      <p class="form__description">Your username has been successfully updated!</p>
      <div class="form__button-group">
        <button class="form__button form__button__cancel" type="button" (click)="onFormClosed()">Return</button>
      </div>
    }
  }

  <ng-container *appEventSpinner="{condition : processing ,eventMessage : 'Updating Username', stretchToParent : false}"/>
</div>
