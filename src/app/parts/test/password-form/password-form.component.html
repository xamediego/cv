<app-submit-form
  [formGroup]="form"
  [form]="form"
  [request]="updateRequest()"
  [formTitle]="formTitle"
  [formDescription]="formDescription"
  [submitText]="submitText"
  [successMessage]="successMessage"
  [successTitle]="successTitle" [onFormClosed]="onFormClosed"
  [onFormSuccess]="onFormSuccess">
  <app-form-input formControlName="currentPassword" type="password" [label]="'Current Password'"/>
  <app-form-input formControlName="newPassword" type="password" [label]="'New Password'"/>
  <app-form-input formControlName="confirmPassword" type="password" [label]="'Confirm Password'"/>
</app-submit-form>
