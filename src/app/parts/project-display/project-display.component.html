@if (projectTypesStorage.length > 0) {
  <ng-container *ngTemplateOutlet="projectView"/>
} @else {
  <p>No projects found</p>
}

<ng-template #projectView>
  <div class="projects">
    <ng-container
      *appEventSpinner="{condition : !isLoaded() ,eventMessage : 'Loading Projects...', stretchToParent : true}"/>
    <div class="projects__wrapper" [ngStyle]="isLoaded() ? {'display' : 'flex'} : {'display' : 'none'}">
      <ng-container *ngTemplateOutlet="archiveFilter"/>
      @for (projectType of projectTypes; track $index) {
        <div class="archive__bottom__project-types">
          <div class="archive__bottom__title__wrapper">
            <div class="archive__bottom__title__wrapper__head">
              <div class="archive__bottom__title__wrapper__head__left">
                <h2>{{ projectType.title }}</h2>
              </div>
            </div>
            <hr class="slice-line">
          </div>
          <ng-container *ngTemplateOutlet="projects; context: { $implicit: projectType }"/>
        </div>
      }
    </div>
  </div>
</ng-template>

<ng-template #projects let-projectType>
  <div class="projects__content">
    @for (project of projectType.projects; track $index) {
      <project-holder
        [project]="project"
        [projectType]="projectType"
        [editable]="editable"
        [onEdit]="onEditSelect"
        [onProjectSelect]="onProjectSelect"
        (loaded)="onImagesLoad()"/>
    }
  </div>
</ng-template>

<ng-template #archiveFilter>
  <form class="archive__filter"
        [formGroup]="filterGroup">
    <div class="archive__filter__selection">
      <p class="archive__filter__title s_t">
        Selection:
      </p>

      <select
        formControlName="selectControl"
        class="archive__filter__search-field"
        [(ngModel)]="selectedFilter">

        <option value="All" selected="selected">All</option>

        @for (projectType of projectTypesStorage; track $index) {
          <option
            [value]="projectType.type">
            {{ projectType.type }}
          </option>
        }
      </select>
    </div>

    <div class="archive__filter__form">

      <p class="archive__filter__title s_t">
        Project Search:
      </p>

      <div class="archive__filter__form__wrapper">
        <input
          formControlName="inputControl"
          class="archive__filter__search-field"
          placeholder="filter..."
          type="text"/>
      </div>
    </div>
  </form>
</ng-template>
