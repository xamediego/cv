<div class="type">
  <ng-container *ngIf="projectType != null">

    <div class="type__header">
      <img class="type__header__icon" ngSrc="{{projectType.icon}}" width="65" height="65"
           alt="{{projectType.type}} - icon"/>
      <div class="type__header__info">
        <h2>{{ projectType.title }}</h2>
        <div class="type__header__info__details">
          <p>
            Items: {{ projectType.projects.length }}
          </p>
        </div>
      </div>
    </div>
    <hr class="slice-line">
    <div class="type__content">
      <ng-container *ngFor="let project of projectType.projects">
        <project-holder [project]="project" [projectType]="projectType"/>
      </ng-container>
    </div>
  </ng-container>
</div>
