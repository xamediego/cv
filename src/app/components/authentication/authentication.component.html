<div class="auth">

  <img alt="icon" src="/ico.png" width="200" height="200">

  <h2 class="auth__title">Login or Register</h2>

  <div class="auth__options">
    <button class="auth__options__register" (click)="register()">
      Register
    </button>

    <button class="auth__options__login" (click)="login()">
      Login
    </button>
  </div>

  <a routerLink="/">Home</a>
</div>
