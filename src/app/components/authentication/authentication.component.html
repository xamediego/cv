<div class="auth">
  <img alt="icon" src="/logo.png" width="200" height="200">
  <h2 class="auth__title">Login or Register</h2>
  <div class="auth__options">
    <a routerLink="/auth/register" class="link-button"><app-button [buttonText]="'Register'"/></a>
    <a routerLink="/auth/login" class="link-button"><app-button [buttonText]="'Login'"/></a>
  </div>
  <a routerLink="/">Home</a>
</div>
