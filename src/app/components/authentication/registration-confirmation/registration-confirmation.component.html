<div class="Confirm-Container">
  <img alt="icon" src="/logo.png" width="200" height="200">

  <h2>{{ confirmMessage }}</h2>

  <ng-container *appEventSpinner="{condition : confirming ,eventMessage : 'Confirming Email....', stretchToParent : true}"/>

  @if (!confirming){
    @if (statusText) {
      <p>{{ statusText }}</p>
    }

    @if (confirmed) {
      <a routerLink="/auth/login'" class="link-button"><app-button [buttonText]="'Proceed to login'"/></a>
    }
  }

</div>
